name: Chase Roblox Route Analysis

on:
  push:
    branches:
      - analysis/roblox-sled-route
    paths:
      - "scripts/chase_roblox_route_analysis.py"
      - "scripts/export_chasewild_roblox_m0.py"
      - "scripts/inspect_chase_lidar.py"
      - ".github/workflows/chase-route-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow requests
      - name: Run Chase / Leonard Park terrain analysis
        run: python scripts/chase_roblox_route_analysis.py
      - name: Inspect source LiDAR products
        run: python scripts/inspect_chase_lidar.py
      - name: Export Chase Wild Roblox M0 terrain inputs
        run: python scripts/export_chasewild_roblox_m0.py
      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: chase-roblox-route-analysis
          path: analysis-output/
          if-no-files-found: error
